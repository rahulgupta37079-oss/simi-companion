<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simi — Interactive 3D Character Studio</title>
  <style>
    :root {
      --panel: rgba(18, 22, 34, 0.84);
      --border: rgba(255, 255, 255, 0.13);
      --text: #f3f5fa;
      --muted: #9aa4bc;
      --amber: #f59e0b;
      --pink: #f472b6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 34%, #352348 0%, #191e33 54%, #0b0e18 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #viewport { width: 100%; height: 100%; display: block; }
    .hud-top {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      gap: 12px;
      z-index: 10;
    }
    .brand {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 800; }
    .brand p { margin: 0; font-size: 12px; color: var(--muted); }
    .actions { pointer-events: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--pink); }
    .btn-primary {
      background: linear-gradient(135deg, var(--amber), var(--pink));
      color: #111827;
      border: none;
    }
    .hud-bottom {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(940px, calc(100% - 24px));
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 9px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 10;
    }
    .row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: center; }
    .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active, .chip:hover {
      border-color: var(--pink);
      background: rgba(244, 114, 182, 0.22);
      color: #fde68a;
    }
    .bubble {
      position: fixed;
      top: 82px;
      right: 24px;
      background: rgba(255, 248, 245, 0.96);
      color: #1f2937;
      border: 2px solid var(--pink);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      z-index: 9;
      max-width: 280px;
      text-align: left;
    }
    /* Realistic 3D CGI Parallax Stage (Default High-Graphic Mode) */
    #cgiStage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      z-index: 2;
      pointer-events: auto;
    }
    #cgiStage.hidden { display: none; }
    .cgi-rig {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
      transition: transform 0.14s ease-out;
      margin-bottom: 58px;
    }
    .cgi-char {
      height: min(64vh, 520px);
      width: auto;
      filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.58)) drop-shadow(0 0 24px rgba(244, 114, 182, 0.22));
      user-select: none;
      transition: opacity 0.12s ease;
    }
    .cgi-char.bob { animation: cgiBob 2.6s ease-in-out infinite; }
    .cgi-char.walk-hop { animation: cgiHop 0.38s ease-in-out infinite; }
    .cgi-char.run-hop { animation: cgiRun 0.25s ease-in-out infinite; }
    .cgi-char.talk-nod { animation: cgiTalk 0.45s ease-in-out infinite; }
    .cgi-pedestal {
      width: 280px;
      height: 54px;
      margin-top: -22px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(244, 114, 182, 0.34) 0%, rgba(28, 34, 54, 0.92) 55%, rgba(11, 14, 24, 0.95) 100%);
      border: 2px solid rgba(244, 114, 182, 0.72);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65), inset 0 2px 12px rgba(255, 255, 255, 0.12);
      transform: rotateX(68deg);
    }
    .cgi-emote {
      position: absolute;
      top: 10px;
      right: -28px;
      font-size: 28px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      animation: cgiBob 1.5s ease-in-out infinite;
    }
    @keyframes cgiBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes cgiHop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }
    @keyframes cgiRun { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-18px) rotate(-1deg); } }
    @keyframes cgiTalk { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.01); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hud-top">
    <div class="brand">
      <h1>Simi — Realistic 3D CGI Studio</h1>
      <p id="modeSubtitle">High-Graphic Realistic 3D CGI • Move Mouse for 3D Depth • Live Animations</p>
    </div>
    <div class="actions">
      <a class="btn" href="index.html">← Home</a>
      <button class="btn" id="modeToggleBtn" onclick="window.toggleStudioMode()">Switch to 3D Mesh (.GLB Orbit)</button>
      <button class="btn btn-primary" onclick="window.downloadGLB()">Download .GLB Model</button>
    </div>
  </div>

  <div class="bubble" id="speechBubble">Suno na! Move your mouse for 3D depth, or click Walk, Run, Talk &amp; Comfort!</div>

  <div id="cgiStage">
    <div class="cgi-rig" id="cgiRig">
      <span class="cgi-emote" id="cgiEmote">✦</span>
      <img class="cgi-char bob" id="cgiImg" src="assets/simi_idle.png" alt="Simi Realistic 3D CGI" />
      <div class="cgi-pedestal"></div>
    </div>
  </div>

  <canvas id="viewport" style="display:none;"></canvas>

  <div class="hud-bottom">
    <div class="row" id="animRow">
      <span class="label">Animation:</span>
      <button class="chip active" data-anim="idle" onclick="window.setAnim('idle')">Idle Wave</button>
      <button class="chip" data-anim="walk" onclick="window.setAnim('walk')">Walk</button>
      <button class="chip" data-anim="run" onclick="window.setAnim('run')">Run</button>
      <button class="chip" data-anim="talk" onclick="window.setAnim('talk')">Talk (Lip-Sync)</button>
      <button class="chip" data-anim="focus" onclick="window.setAnim('focus')">Playful Scold</button>
      <button class="chip" data-anim="care" onclick="window.setAnim('care')">Comfort Hug</button>
      <button class="chip" data-anim="laugh" onclick="window.setAnim('laugh')">Celebrate</button>
      <button class="chip" data-anim="sleepy" onclick="window.setAnim('sleepy')">Sleepy Night</button>
    </div>
    <div class="row" id="outfitRow">
      <span class="label">Outfit:</span>
      <button class="chip active" data-outfit="peach" onclick="window.setOutfit('peach')">Peach Embroidered + Mint Dupatta</button>
      <button class="chip" data-outfit="paisley" onclick="window.setOutfit('paisley')">Blue-Purple Paisley Kurti</button>
      <button class="chip" data-outfit="floral" onclick="window.setOutfit('floral')">Pastel Pink Floral Kurti</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.42;

    // Clean full-body framing with pedestal completely visible above bottom HUD bar
    const camera = new THREE.PerspectiveCamera(29, window.innerWidth / window.innerHeight, 0.05, 60);
    camera.position.set(0.18, 1.15, 4.95);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0.80, 0);
    controls.minDistance = 1.4;
    controls.maxDistance = 6.8;
    controls.maxPolarAngle = Math.PI * 0.56;

    // Balanced 4-Point Warm Pixar Studio Lighting (even luminous caramel-tan skin, zero pale-forehead/dark-chin split)
    const keyLight = new THREE.DirectionalLight(0xfff4e6, 1.65);
    keyLight.position.set(2.2, 2.4, 4.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe8e6, 1.15);
    fillLight.position.set(-3.0, 1.4, 3.2);
    scene.add(fillLight);

    const bounceLight = new THREE.DirectionalLight(0xffdfc8, 1.25);
    bounceLight.position.set(0.0, -1.2, 3.8);
    scene.add(bounceLight);

    const rimLight = new THREE.DirectionalLight(0xf9a8d4, 1.75);
    rimLight.position.set(-1.4, 2.8, -3.6);
    scene.add(rimLight);

    const rimLight2 = new THREE.DirectionalLight(0xc4b5fd, 1.15);
    rimLight2.position.set(2.2, 2.4, -3.2);
    scene.add(rimLight2);

    scene.add(new THREE.HemisphereLight(0xfff5f5, 0x4c3558, 0.85));

    // Studio Pedestal
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(0.64, 0.74, 0.055, 64),
      new THREE.MeshStandardMaterial({ color: 0x1e2438, roughness: 0.32, metalness: 0.25 })
    );
    pedestal.position.y = -0.028;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    const ringGlow = new THREE.Mesh(
      new THREE.RingGeometry(0.61, 0.645, 64),
      new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide, transparent: true, opacity: 0.82 })
    );
    ringGlow.rotation.x = -Math.PI / 2;
    ringGlow.position.y = 0.002;
    scene.add(ringGlow);

    // ==================== High-Res Painted Face, Iris & Kurti Textures ====================
    function makeFaceTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      // Warm caramel-tan Indian Pixar skin
      ctx.fillStyle = '#d6976e';
      ctx.fillRect(0, 0, 1024, 1024);

      // Soft lit front-face center around u=0.25 (x=256)
      const glow = ctx.createRadialGradient(256, 520, 20, 256, 520, 210);
      glow.addColorStop(0, '#e3a67d');
      glow.addColorStop(1, '#d29168');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 280, 512, 480);

      // Soft rosy Pixar cheeks right under the glasses rims (x=256 ± 60, y=560)
      for (const cx of [196, 316]) {
        const g = ctx.createRadialGradient(cx, 560, 8, cx, 560, 48);
        g.addColorStop(0, 'rgba(236, 95, 118, 0.44)');
        g.addColorStop(0.55, 'rgba(236, 95, 118, 0.18)');
        g.addColorStop(1, 'rgba(236, 95, 118, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(cx - 54, 506, 108, 108);
      }

      // Subtle warm nose highlight
      const ng = ctx.createRadialGradient(256, 558, 3, 256, 558, 20);
      ng.addColorStop(0, 'rgba(255, 205, 178, 0.35)');
      ng.addColorStop(1, 'rgba(255, 205, 178, 0)');
      ctx.fillStyle = ng;
      ctx.fillRect(230, 530, 52, 52);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeIrisTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 14, 128, 128, 124);
      g.addColorStop(0, '#100602');
      g.addColorStop(0.30, '#1c0b05');
      g.addColorStop(0.45, '#592c16');
      g.addColorStop(0.78, '#7e4422');
      g.addColorStop(0.92, '#2d1408');
      g.addColorStop(1, '#100602');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = 'rgba(255, 198, 132, 0.22)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(128 + Math.cos(a) * 42, 128 + Math.sin(a) * 42);
        ctx.lineTo(128 + Math.cos(a) * 106, 128 + Math.sin(a) * 106);
        ctx.stroke();
      }
      const cres = ctx.createRadialGradient(128, 178, 6, 128, 178, 56);
      cres.addColorStop(0, 'rgba(255, 212, 156, 0.68)');
      cres.addColorStop(1, 'rgba(255, 212, 156, 0)');
      ctx.fillStyle = cres;
      ctx.fillRect(60, 120, 136, 114);

      // Twin crisp sparkling Pixar catchlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(88, 82, 26, 22, -0.35, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(170, 156, 11, 0, Math.PI * 2); ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeKurtiTextures(style) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');

      const b = document.createElement('canvas');
      b.width = 512; b.height = 512;
      const bctx = b.getContext('2d');
      bctx.fillStyle = '#808080';
      bctx.fillRect(0, 0, 512, 512);

      if (style === 'peach') {
        // Warm coral-peach kurti matching Reference Photo 2!
        const grad = ctx.createLinearGradient(0, 0, 0, 1024);
        grad.addColorStop(0, '#f3a192');
        grad.addColorStop(1, '#e88b7d');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);

        // Linen micro-weave
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        for (let i = 0; i < 1024; i += 8) {
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
        }

        // Rich mint + silver embroidered front chest panel (u=0.5 -> x=512, top y=24..420)
        ctx.fillStyle = 'rgba(218, 112, 100, 0.42)';
        ctx.fillRect(420, 24, 184, 390);
        ctx.strokeStyle = '#e6f7ea';
        ctx.lineWidth = 6;
        ctx.strokeRect(428, 32, 168, 374);
        ctx.strokeStyle = '#9be0b3';
        ctx.lineWidth = 3;
        ctx.strokeRect(442, 46, 140, 346);

        // Floral vine embroidery columns on chest yoke
        for (let y = 78; y < 380; y += 48) {
          for (const dx of [-42, 42]) {
            ctx.fillStyle = '#c9f2d5';
            ctx.beginPath(); ctx.ellipse(512 + dx, y, 16, 7, dx > 0 ? 0.45 : -0.45, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff8f0';
            ctx.beginPath(); ctx.arc(512 + dx * 0.72, y + 14, 5, 0, Math.PI * 2); ctx.fill();
            bctx.fillStyle = '#f0f0f0';
            bctx.beginPath(); bctx.arc((512 + dx) / 2, y / 2, 7, 0, Math.PI * 2); bctx.fill();
          }
        }
        // Subtle floral dots across lower flare
        for (let i = 0; i < 120; i++) {
          const x = (i * 113 + 37) % 1024, y = 440 + ((i * 197 + 53) % 520);
          ctx.fillStyle = 'rgba(255, 246, 238, 0.48)';
          ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
        }
        // Embroidered white/mint bottom scalloped lace trim
        ctx.fillStyle = '#fff5ee';
        for (let x = 0; x < 1024; x += 26) {
          ctx.beginPath(); ctx.arc(x + 13, 1008, 13, 0, Math.PI * 2); ctx.fill();
        }
      } else if (style === 'paisley') {
        ctx.fillStyle = '#334173';
        ctx.fillRect(0, 0, 1024, 1024);
        const cols = ['#7dd3fc', '#c084fc', '#f472b6', '#5eead4', '#e0e7ff'];
        for (let i = 0; i < 340; i++) {
          const x = (i * 139 + 29) % 1024;
          const y = (i * 223 + 41) % 1024;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate((i % 9) * 0.7);
          ctx.fillStyle = cols[i % cols.length];
          ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.moveTo(0, -18);
          ctx.bezierCurveTo(16, -12, 14, 16, 0, 20);
          ctx.bezierCurveTo(-14, 16, -12, -8, 0, -18);
          ctx.fill();
          ctx.strokeStyle = '#1e1b4b';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      } else {
        ctx.fillStyle = '#f7d6d4';
        ctx.fillRect(0, 0, 1024, 1024);
        for (let i = 0; i < 190; i++) {
          const x = (i * 107 + 23) % 1024;
          const y = (i * 179 + 19) % 950;
          ctx.fillStyle = i % 2 === 0 ? '#e07a68' : '#a78bfa';
          ctx.globalAlpha = 0.82;
          for (let p = 0; p < 5; p++) {
            const a = (p / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(x + Math.cos(a) * 8, y + Math.sin(a) * 8, 5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#fde68a';
          ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#6b9a78';
          ctx.fillRect(x - 2, y + 10, 4, 12);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffffff';
        for (let x = 0; x < 1024; x += 24) {
          ctx.beginPath(); ctx.arc(x + 12, 1008, 12, 0, Math.PI * 2); ctx.fill();
        }
      }
      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      const bump = new THREE.CanvasTexture(b);
      bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
      return { map, bump };
    }

    // ==================== Sculpted Pixar Anatomy Builders ====================
    function makeSculptedHeadGeo() {
      const geo = new THREE.SphereGeometry(0.275, 64, 48);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        // Classic Pixar/Nendoroid cute ratio: fuller cheeks, compact gentle chin (NO bulbous bottom!)
        y *= 0.99;
        x *= 1.03;

        if (y < -0.02) {
          const t = Math.min(1, (-y - 0.02) / 0.25);
          // Smooth feminine V-oval jaw taper
          x *= (1.0 - t * 0.26);
          if (z > 0) z *= (1.0 - t * 0.10);
          // Pull bottom chin slightly up so lower face is compact & cute
          y += t * t * 0.032;
        }

        // Cute soft apple cheeks right under glasses
        const cheekL = Math.exp(-((x + 0.125) ** 2 / 0.0085 + (y + 0.048) ** 2 / 0.006 + (z - 0.21) ** 2 / 0.012));
        const cheekR = Math.exp(-((x - 0.125) ** 2 / 0.0085 + (y + 0.048) ** 2 / 0.006 + (z - 0.21) ** 2 / 0.012));
        z += (cheekL + cheekR) * 0.022;

        // Gentle recessed eye sockets at lowered 47% eye line (y = -0.012)
        const sockL = Math.exp(-((x + 0.095) ** 2 / 0.0052 + (y + 0.012) ** 2 / 0.004 + (z - 0.235) ** 2 / 0.012));
        const sockR = Math.exp(-((x - 0.095) ** 2 / 0.0052 + (y + 0.012) ** 2 / 0.004 + (z - 0.235) ** 2 / 0.012));
        z -= (sockL + sockR) * 0.024;

        // Cute soft sculpted nose tip right between eyes & smile
        const noseTip = Math.exp(-(x ** 2 / 0.00075 + (y + 0.056) ** 2 / 0.00095 + (z - 0.258) ** 2 / 0.008));
        z += noseTip * 0.028;

        pos.setXYZ(i, x, y, z);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function makeRoundedGlassesRim(w, h, r, thickness) {
      function roundedRectPath(rw, rh, rr) {
        const p = new THREE.Shape();
        const x = -rw / 2, y = -rh / 2;
        p.moveTo(x + rr, y);
        p.lineTo(x + rw - rr, y);
        p.quadraticCurveTo(x + rw, y, x + rw, y + rr);
        p.lineTo(x + rw, y + rh - rr);
        p.quadraticCurveTo(x + rw, y + rh, x + rw - rr, y + rh);
        p.lineTo(x + rr, y + rh);
        p.quadraticCurveTo(x, y + rh, x, y + rh - rr);
        p.lineTo(x, y + rr);
        p.quadraticCurveTo(x, y, x + rr, y);
        return p;
      }
      const outer = roundedRectPath(w, h, r);
      const hole = roundedRectPath(w - thickness * 2, h - thickness * 2, Math.max(0.004, r - thickness * 0.8));
      outer.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(outer, {
        depth: 0.007,
        bevelEnabled: true,
        bevelThickness: 0.0022,

      const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
      const tubularSegs = 22;
      const radialSegs = 10;
      const geo = new THREE.TubeGeometry(curve, tubularSegs, rStart, radialSegs, false);
      const pos = geo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i <= tubularSegs; i++) {
        const t = i / tubularSegs;
        const center = curve.getPointAt(t);
        const factor = (1.0 - t) * 0.85 + (rEnd / rStart) * t + Math.sin(t * Math.PI) * 0.22;
        for (let j = 0; j <= radialSegs; j++) {
          const idx = i * (radialSegs + 1) + j;
          v.fromBufferAttribute(pos, idx).sub(center).multiplyScalar(factor).add(center);
          pos.setXYZ(idx, v.x, v.y, v.z);
        }
      }
      geo.computeVertexNormals();
      return geo;
    }

      const elbow = new THREE.Group();
      elbow.position.y = -0.215;
      shoulder.add(elbow);

      // Seamless elbow sphere so zero dark crease appears when elbow bends
      const elbowJoint = new THREE.Mesh(new THREE.SphereGeometry(0.0355, 16, 14), skinMat);
      elbow.add(elbowJoint);

      const forearm = new THREE.Mesh(new THREE.CapsuleGeometry(0.032, 0.15, 10, 18), skinMat);
      forearm.position.y = -0.085;
      forearm.castShadow = true;
      elbow.add(forearm);

      // Cute Sculpted Pixar Hand with Palm + Angled Thumb + 4 Delicate Fingers!
      const hand = new THREE.Group();
      hand.position.y = -0.185;
      const palm = new THREE.Mesh(new THREE.SphereGeometry(0.036, 18, 14), skinMat);
      palm.scale.set(0.92, 0.96, 0.54);
      hand.add(palm);

      const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.0095, 0.026, 6, 10), skinMat);
      thumb.position.set(-side * 0.034, -0.004, 0.008);
      thumb.rotation.z = side * 0.78;
      hand.add(thumb);

      for (let f = 0; f < 4; f++) {
        const fx = (-0.021 + f * 0.014) * side;
        const flen = f === 1 || f === 2 ? 0.030 : 0.024;
        const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.0072, flen, 6, 10), skinMat);
        finger.position.set(fx, -0.036 - (f === 1 || f === 2 ? 0.004 : 0), 0.003);
        finger.rotation.z = (-0.12 + f * 0.08) * side;
        hand.add(finger);
      }
      elbow.add(hand);

      torso.add(shoulder);
      return { shoulder, elbow, hand };
    }
    const armL = makeArm(-1); // viewer's left
    const armR = makeArm(1);  // viewer's right (waving hand!)

    const legGeo = makeTaperedLegGeo();
    function makeLeg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.092, -0.24, -0.01);

      const legMesh = new THREE.Mesh(legGeo, leggingMat);
      legMesh.castShadow = true;
      hip.add(legMesh);

      const knee = new THREE.Group();
      knee.position.y = -0.24;
      hip.add(knee);

      const foot = new THREE.Mesh(new THREE.SphereGeometry(0.046, 18, 14), skinMat);
      foot.position.set(0, -0.252, 0.032);
      foot.scale.set(0.84, 0.48, 1.48);
      knee.add(foot);

      const sole = new THREE.Mesh(new THREE.CapsuleGeometry(0.039, 0.080, 8, 14), sandalMat);
      sole.rotation.x = Math.PI / 2;
      sole.scale.set(1.0, 1.0, 0.28);
      sole.position.set(0, -0.272, 0.035);
      sole.castShadow = true;
      knee.add(sole);

      const strap = new THREE.Mesh(new THREE.TorusGeometry(0.038, 0.007, 8, 18, Math.PI), sandalMat);
      strap.position.set(0, -0.256, 0.048);
      knee.add(strap);

      hips.add(hip);
      return { hip, knee };
    }
    const legL = makeLeg(-1);
    const legR = makeLeg(1);

    // Glowing Floating 3D Heart for Comfort Hug
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0.035);
    heartShape.bezierCurveTo(0, 0.08, -0.075, 0.115, -0.095, 0.05);
    heartShape.bezierCurveTo(-0.115, -0.015, -0.04, -0.075, 0, -0.105);
    heartShape.bezierCurveTo(0.04, -0.075, 0.115, -0.015, 0.095, 0.05);
    heartShape.bezierCurveTo(0.075, 0.115, 0, 0.08, 0, 0.035);
    const heart3D = new THREE.Mesh(
      new THREE.ExtrudeGeometry(heartShape, { depth: 0.032, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 5 }),
      new THREE.MeshPhysicalMaterial({ color: 0xf43f5e, emissive: 0xf43f5e, emissiveIntensity: 0.6, roughness: 0.15, clearcoat: 1 })
    );
    heart3D.position.set(0, 0.22, 0.30);
    heart3D.visible = false;
    torso.add(heart3D);

    // ==================== Animation State Machine ====================
    let currentAnim = 'idle';
    const bubbleEl = document.getElementById('speechBubble');
    const animLines = {
      idle: 'Suno na! Rotate me in 3D, switch my kurti, or try Walk, Run & Lip-Sync!',
      walk: 'Bas aise hi stroll kar rahi hoon — tum apna kaam karo, main yahin hoon!',
      run: 'Chalo chalo! Running over to keep you energized and winning!',
      talk: 'Suno na, tumne khana khaya? Aapne yeh kitne achhe se complete kiya!',
      focus: 'Arey pakde gaye! Reels band karo aur wapas apne kaam pe aao!',
      care: 'Koi baat nahi, main hoon na tumhare saath. Ek gehri saans lo.',
      laugh: 'Shabash!! Ek aur goal complete — so proud of you!',
      sleepy: 'Dekho kitni raat ho gayi... aankhein rest karo aur jaldi so jao please.',
    };

    let studioMode = 'cgi'; // 'cgi' (default realistic high-graphic) or 'mesh' (360° GLB orbit)
    let cgiTimer = null;
    const cgiStage = document.getElementById('cgiStage');
    const cgiRig = document.getElementById('cgiRig');
    const cgiImg = document.getElementById('cgiImg');
    const cgiEmote = document.getElementById('cgiEmote');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeSubtitle = document.getElementById('modeSubtitle');

    document.addEventListener('mousemove', (e) => {
      if (studioMode !== 'cgi') return;
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      cgiRig.style.transform = `rotateY(${nx * 14}deg) rotateX(${-ny * 8}deg)`;
    });

    function updateCgiAnimation(name) {
      if (cgiTimer) { clearInterval(cgiTimer); cgiTimer = null; }
      cgiImg.className = 'cgi-char';
      const emotes = {
        idle: '✦', walk: '♪', run: '🔥', talk: '💬',
        focus: '💢', care: '♥', laugh: '🏆', sleepy: 'Zzz'
      };
      cgiEmote.textContent = emotes[name] || '✦';
      if (name === 'walk') {
        cgiImg.classList.add('walk-hop');
        let f = 0;
        cgiImg.src = 'assets/simi_walk_1.png';
        cgiTimer = setInterval(() => {
          cgiImg.src = (f++ % 2 === 0) ? 'assets/simi_walk_2.png' : 'assets/simi_walk_1.png';
        }, 210);
      } else if (name === 'run') {
        cgiImg.classList.add('run-hop');
        let f = 0;
        cgiImg.src = 'assets/simi_run_1.png';
        cgiTimer = setInterval(() => {
          cgiImg.src = (f++ % 2 === 0) ? 'assets/simi_run_2.png' : 'assets/simi_run_1.png';
        }, 140);
      } else if (name === 'talk') {
        cgiImg.classList.add('talk-nod');
        let f = 0;
        cgiImg.src = 'assets/simi_talk.png';
        cgiTimer = setInterval(() => {
          cgiImg.src = (f++ % 2 === 0) ? 'assets/simi_idle.png' : 'assets/simi_talk.png';
        }, 240);
      } else {
        cgiImg.classList.add('bob');
        cgiImg.src = `assets/simi_${name === 'laugh' ? 'laugh' : name}.png`;
      }
    }

    window.toggleStudioMode = () => {
      studioMode = (studioMode === 'cgi') ? 'mesh' : 'cgi';
      if (studioMode === 'cgi') {
        cgiStage.classList.remove('hidden');
        canvas.style.display = 'none';
        modeToggleBtn.textContent = 'Switch to 3D Mesh (.GLB Orbit)';
        modeSubtitle.textContent = 'High-Graphic Realistic 3D CGI • Move Mouse for 3D Depth • Live Animations';
      } else {
        cgiStage.classList.add('hidden');
        canvas.style.display = 'block';
        modeToggleBtn.textContent = 'Switch to Realistic 3D CGI';
        modeSubtitle.textContent = 'Real-Time 360° 3D Mesh • Drag to Orbit • Scroll to Zoom';
      }
    };

    window.setAnim = (name) => {
      currentAnim = name;
      bubbleEl.textContent = animLines[name] || '';
      document.querySelectorAll('#animRow .chip').forEach(b => b.classList.toggle('active', b.dataset.anim === name));
      updateCgiAnimation(name);
    };
    updateCgiAnimation('idle');

    window.setOutfit = (style) => {
      const t = makeKurtiTextures(style);
      kurtiMat.map = t.map;
      kurtiMat.bumpMap = t.bump;
      kurtiMat.needsUpdate = true;
      dupatta.visible = (style === 'peach');
      peachButtons.visible = (style === 'peach');
      document.querySelectorAll('#outfitRow .chip').forEach(b => b.classList.toggle('active', b.dataset.outfit === style));
    };

    window.downloadGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        simi,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'simi_3d_model.glb';
          a.click();
        },
        (err) => alert('Export error: ' + err),
        { binary: true }
      );
    };

    window.exportTransparentPNG = () => {
      pedestal.visible = false;
      ringGlow.visible = false;
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      pedestal.visible = true;
      ringGlow.visible = true;
      const a = document.createElement('a');
      a.href = url;
      a.download = `simi_3d_${currentAnim}.png`;
      a.click();
    };

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      hips.position.y = 0.76 + Math.sin(t * 2.3) * 0.011;
      hips.rotation.set(0, 0, 0);
      torso.rotation.set(0, 0, 0);
      head.rotation.set(0, 0, 0);

      // Natural relaxed outward arm resting stance (zero skirt clipping!)
      armL.shoulder.rotation.set(-0.12, 0, -0.24);
      armR.shoulder.rotation.set(-0.12, 0, 0.24);
      armL.elbow.rotation.set(-0.28, 0, 0.10);
      armR.elbow.rotation.set(-0.28, 0, -0.10);

      // Natural gentle A-stance for legs
      legL.hip.rotation.set(0, 0, -0.045);
      legR.hip.rotation.set(0, 0, 0.045);
      legL.knee.rotation.set(0, 0, 0);
      legR.knee.rotation.set(0, 0, 0);

      ponytail.rotation.set(0, Math.sin(t * 2.2) * 0.09, Math.sin(t * 1.8) * 0.07);
      heart3D.visible = false;

      const blinkCycle = t % 4.3;
      let lidAngle = (blinkCycle > 4.12) ? 0.02 : -Math.PI * 0.42;

      lowerLipPivot.position.y = 0.0;
      smileInterior.scale.set(1.22, 0.54, 0.28);
      eyebrows.forEach(({ mesh }) => { mesh.rotation.z = 0; });

      if (currentAnim === 'idle') {
        // Viewer's right arm (armR, +X) waves cheerfully OUTWARD in open air beside her cheek!
        armR.shoulder.rotation.set(-0.35, 0, 2.28);
        armR.elbow.rotation.set(0, 0, 0.36 + Math.sin(t * 6.0) * 0.25);
        // Viewer's left arm rests softly beside hip in front of kurti
        armL.shoulder.rotation.set(-0.18, 0, -0.26);
        armL.elbow.rotation.set(-0.32, 0, 0.14);
        head.rotation.z = Math.sin(t * 1.5) * 0.05;
      } else if (currentAnim === 'walk') {
        const w = t * 6.2;
        hips.position.y = 0.76 + Math.abs(Math.sin(w)) * 0.04;
        hips.rotation.y = Math.sin(w) * 0.08;
        legL.hip.rotation.x = Math.sin(w) * 0.48;
        legR.hip.rotation.x = -Math.sin(w) * 0.48;
        armL.shoulder.rotation.set(-Math.sin(w) * 0.45, 0, -0.20);
        armR.shoulder.rotation.set(Math.sin(w) * 0.45, 0, 0.20);
        armL.elbow.rotation.x = -0.25;
        armR.elbow.rotation.x = -0.25;
        ponytail.rotation.x = 0.22 + Math.abs(Math.sin(w)) * 0.16;
      } else if (currentAnim === 'run') {
        const r = t * 11.0;
        hips.position.y = 0.79 + Math.abs(Math.sin(r)) * 0.085;
        torso.rotation.x = 0.16;
        legL.hip.rotation.x = Math.sin(r) * 0.78;
        legR.hip.rotation.x = -Math.sin(r) * 0.78;
        armL.shoulder.rotation.set(-Math.sin(r) * 0.85, 0, -0.22);
        armR.shoulder.rotation.set(Math.sin(r) * 0.85, 0, 0.22);
        armL.elbow.rotation.x = -1.05;
        armR.elbow.rotation.x = -1.05;
        ponytail.rotation.x = 0.55 + Math.sin(r) * 0.22;
        lowerLipPivot.position.y = -0.012;
        smileInterior.scale.set(1.25, 0.76, 0.30);
      } else if (currentAnim === 'talk') {
        const open = Math.abs(Math.sin(t * 14.0)) * 0.022;
        lowerLipPivot.position.y = -open;
        smileInterior.scale.set(1.20, 0.34 + open * 28, 0.30);
        head.rotation.x = Math.sin(t * 4.5) * 0.04;
        head.rotation.y = Math.sin(t * 2.0) * 0.08;
        armL.shoulder.rotation.set(-0.62, 0, -0.32);
        armR.shoulder.rotation.set(-0.72, 0, 0.32);
        armL.elbow.rotation.set(-0.82 + Math.sin(t * 5.8) * 0.16, 0, 0.20);
        armR.elbow.rotation.set(-0.92 + Math.cos(t * 5.8) * 0.16, 0, -0.20);
      } else if (currentAnim === 'focus') {
        armL.shoulder.rotation.set(0.05, 0, -0.78);
        armL.elbow.rotation.set(0, 0, 1.32);
        armR.shoulder.rotation.set(-0.98, 0, 0.36);
        armR.elbow.rotation.set(-0.55 + Math.sin(t * 9.0) * 0.16, 0, 0);
        head.rotation.z = -0.06;
        eyebrows.forEach(({ mesh, side }) => { mesh.rotation.z = side * 0.20; });
      } else if (currentAnim === 'care') {
        heart3D.visible = true;
        heart3D.scale.setScalar(1.0 + Math.sin(t * 5.0) * 0.12);
        heart3D.position.y = 0.22 + Math.sin(t * 2.5) * 0.02;
        armL.shoulder.rotation.set(-0.80, 0.35, -0.22);
        armR.shoulder.rotation.set(-0.80, -0.35, 0.22);
        armL.elbow.rotation.set(-0.78, 0, 0.35);
        armR.elbow.rotation.set(-0.78, 0, -0.35);
        head.rotation.z = 0.08;
      } else if (currentAnim === 'laugh') {
        const j = Math.abs(Math.sin(t * 6.5));
        hips.position.y = 0.76 + j * 0.14;
        armL.shoulder.rotation.set(-0.2, 0, -2.48);
        armR.shoulder.rotation.set(-0.2, 0, 2.48);
        lowerLipPivot.position.y = -0.016;
        smileInterior.scale.set(1.28, 0.88, 0.32);
        lidAngle = -0.18;
      } else if (currentAnim === 'sleepy') {
        lidAngle = -0.10;
        head.rotation.x = 0.10 + Math.sin(t * 1.4) * 0.04;
        armR.shoulder.rotation.set(-1.32, -0.15, 0.28);
        armR.elbow.rotation.set(-1.02, 0, -0.25);
        const yawn = 0.014 + Math.sin(t * 1.8) * 0.008;
        lowerLipPivot.position.y = -yawn;
        smileInterior.scale.set(0.74, 0.56 + yawn * 16, 0.30);
      }

      eyelids.forEach(l => { l.rotation.x = lidAngle; });
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
